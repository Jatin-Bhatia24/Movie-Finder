<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Finder</title>
    <link rel = "stylesheet" href = "project025.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Lora:ital,wght@0,400..700;1,400..700&family=Skranji&display=swap" rel="stylesheet">
</head>
<body>
    
    <main class="container">

        <header>

            <div class="title">
                <span> <i class="fa-solid fa-video"></i></span>
                <h1>Movie Finder</h1>
            </div>

            <div class="searchbar">
                <input type =  "text" id="movie_name" placeholder="Search Movie">
                <button id="search_btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </header>

        <div class="main-content">

            <div class="img">
                <img src="movies.jpeg">
            </div>

            <div class="text-content">
                <span id="name_movie">Enter A Movie Name For It's Information</span>

                <div class="rating-div">
                    <span>Rating :</span>
                    <span id="rating"> </span>
                </div>

                <div class="genre">
                 
                </div>
                
                <div class="infos">
                    <h3>Released Date :<span id="Released_date"></span> </h3>
                </div>
                <div class="infos">
                    <h3>Language :<span id="language"></span> </h3>
                </div>
                <div class="infos">
                    <h3>Duration :<span id="duration"></span> </h3>
                </div>
                <div class="infos">
                    <h3>Cast :<span id="cast"></span> </h3>
                
                </div>
                <div class="infos">
                    <h3>Plot :<span id="plot"></span> </h3>
                </div>

            </div>
        </div>




        <footer>© 2026 Movie Finder</footer>


    </main>
    <script src="https://kit.fontawesome.com/c86fa55d11.js" crossorigin="anonymous"></script>
    <script src = "project025.js"></script>
</body>
</html>
